<aside class="sidebar" [class.mobile-open]="mobileOpen" [class.collapsed]="collapsed">
  <div class="sidebar-brand">
    <span class="brand-mark" aria-hidden="true">G</span>
    <div class="brand-copy">
      <strong>GymAdmin</strong>
      <span>GYM ADMINISTRATION</span>
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="Primary navigation">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" title="Dashboard" (click)="selectNavigation()">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="nav-label">Dashboard</span>
    </a>

    <button class="nav-item nav-item-button" type="button" [class.active-parent]="membersExpanded" title="Members" (click)="toggleMembers()">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-3.5 3-5.5 7-5.5s6.5 2 7 5.5"/></svg></span><span class="nav-label">Members</span><span class="nav-chevron" aria-hidden="true">{{ membersExpanded ? '⌄' : '›' }}</span>
    </button>
    <div class="submenu" [class.expanded]="membersExpanded">
      <a routerLink="/members" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="selectNavigation()">All Members</a>
      <a routerLink="/members" [queryParams]="{ view: 'renewals' }" routerLinkActive="active" (click)="selectNavigation()">Renewals</a>
    </div>

    <a class="nav-item" routerLink="/dashboard" title="Staff" (click)="selectNavigation()"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.4-3.2 2.8-5 7-5s6.6 1.8 7 5"/></svg></span><span class="nav-label">Staff</span></a>
    <a class="nav-item" routerLink="/dashboard" title="Attendance" (click)="selectNavigation()"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg></span><span class="nav-label">Attendance</span></a>
    <a class="nav-item" routerLink="/dashboard" title="Payments" (click)="selectNavigation()"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg></span><span class="nav-label">Payments</span></a>
    <a class="nav-item" routerLink="/dashboard" title="Expenses" (click)="selectNavigation()"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg></span><span class="nav-label">Expenses</span></a>
    <a class="nav-item" routerLink="/dashboard" title="Plans" (click)="selectNavigation()"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg></span><span class="nav-label">Plans</span></a>
    <a class="nav-item" routerLink="/dashboard" title="Reports" (click)="selectNavigation()"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span><span class="nav-label">Reports</span></a>
  </nav>

  <div class="sidebar-footer">
    <a class="nav-item" routerLink="/dashboard" title="Settings" (click)="selectNavigation()"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.2-1.6l1.7-1.3-2-3.4-2 .8a7 7 0 0 0-2.7-1.6L13.5 3h-3l-.3 1.9a7 7 0 0 0-2.7 1.6l-2-.8-2 3.4 1.7 1.3A7 7 0 0 0 5 12c0 .6.1 1.1.2 1.6l-1.7 1.3 2 3.4 2-.8a7 7 0 0 0 2.7 1.6l.3 1.9h3l.3-1.9a7 7 0 0 0 2.7-1.6l2 .8 2-3.4-1.7-1.3c.1-.5.2-1 .2-1.6Z"/></svg></span><span class="nav-label">Settings</span></a>
    <button class="nav-item nav-item-button" type="button" title="Sign Out"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></svg></span><span class="nav-label">Sign Out</span></button>
  </div>
</aside>
