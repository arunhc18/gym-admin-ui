<aside
  class="sidebar"
  [class.mobile-open]="mobileOpen"
  [class.collapsed]="collapsed"
>


  <!-- =====================================================
       BRAND
  ====================================================== -->

  <div class="sidebar-brand">


    <span
      class="brand-mark"
      aria-hidden="true"
    >
      G
    </span>


    <div class="brand-copy">

      <strong>
        GymAdmin
      </strong>

      <span>
        GYM ADMINISTRATION
      </span>

    </div>


  </div>


  <!-- =====================================================
       MAIN NAVIGATION
  ====================================================== -->

  <nav
    class="sidebar-nav"
    aria-label="Primary navigation"
  >


    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <a
      class="nav-item"
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        exact: true
      }"
      title="Dashboard"
      (click)="selectNavigation()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <rect
            x="3"
            y="3"
            width="7"
            height="7"
            rx="1"
          >
          </rect>

          <rect
            x="14"
            y="3"
            width="7"
            height="7"
            rx="1"
          >
          </rect>

          <rect
            x="3"
            y="14"
            width="7"
            height="7"
            rx="1"
          >
          </rect>

          <rect
            x="14"
            y="14"
            width="7"
            height="7"
            rx="1"
          >
          </rect>

        </svg>

      </span>


      <span class="nav-label">
        Dashboard
      </span>


    </a>


    <!-- =====================================================
         VENDORS
    ====================================================== -->

    <a
      class="nav-item"
      routerLink="/vendors"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        exact: true
      }"
      title="Vendors"
      (click)="selectNavigation()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="M4 7h16v13H4z"
          >
          </path>

          <path
            d="M8 7V4h8v3"
          >
          </path>

          <path
            d="M4 11h16"
          >
          </path>

          <path
            d="M10 15h4"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Vendors
      </span>


    </a>


    <!-- =====================================================
         PRODUCTS
    ====================================================== -->

    <a
      class="nav-item"
      routerLink="/products"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        exact: true
      }"
      title="Products"
      (click)="selectNavigation()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <path d="M4 7l8-4 8 4-8 4-8-4Z"></path>
          <path d="M4 7v10l8 4 8-4V7"></path>
          <path d="M12 11v10"></path>

        </svg>

      </span>


      <span class="nav-label">
        Products
      </span>


    </a>


    <!-- =====================================================
         MEMBERS
    ====================================================== -->

    <button
      class="nav-item nav-item-button"
      type="button"
      [class.active-parent]="membersExpanded"
      title="Members"
      (click)="toggleMembers()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="8"
            r="3.5"
          >
          </circle>

          <path
            d="M5 20c.5-3.5 3-5.5 7-5.5s6.5 2 7 5.5"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Members
      </span>


      <span
        class="nav-chevron"
        aria-hidden="true"
      >

        {{
          membersExpanded
            ? '⌄'
            : '›'
        }}

      </span>


    </button>


    <!-- =====================================================
         MEMBER SUBMENU
    ====================================================== -->

    <div
      class="submenu members-submenu"
      [class.expanded]="membersExpanded"
    >


      <a
        routerLink="/members"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="selectNavigation()"
      >

        All Members

      </a>


      <a
        routerLink="/renewals"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="selectNavigation()"
      >

        Renewals

      </a>


    </div>


    <!-- =====================================================
         VISITORS
    ====================================================== -->

    <a
      class="nav-item"
      routerLink="/visitors"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        exact: true
      }"
      title="Visitors"
      (click)="selectNavigation()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="8"
            r="3"
          >
          </circle>

          <path
            d="M5 20c.5-3.5 3-5.5 7-5.5s6.5 2 7 5.5M19 8v5M16.5 10.5h5"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Visitors
      </span>


    </a>


    <!-- =====================================================
         STAFF
    ====================================================== -->

    <a
      class="nav-item"
      routerLink="/staff"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        exact: true
      }"
      title="Staff"
      (click)="selectNavigation()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="8"
            r="3"
          >
          </circle>

          <path
            d="M5 20c.4-3.2 2.8-5 7-5s6.6 1.8 7 5"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Staff
      </span>


    </a>


    <!-- =====================================================
         ATTENDANCE
    ====================================================== -->

    <a
      class="nav-item"
      routerLink="/attendance"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        exact: true
      }"
      title="Attendance"
      (click)="selectNavigation()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="12"
            r="8.5"
          >
          </circle>

          <path
            d="M12 7v5l3 2"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Attendance
      </span>


    </a>


    <!-- =====================================================
         CLASSES
    ====================================================== -->

    <button
      class="nav-item nav-item-button"
      type="button"
      [class.active-parent]="classesExpanded"
      title="Classes"
      (click)="toggleClasses()"
    >

      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <rect
            x="3"
            y="4"
            width="18"
            height="17"
            rx="2"
          >
          </rect>

          <path
            d="M8 2v4M16 2v4M3 10h18"
          >
          </path>

          <path
            d="M8 14h3M13 14h3M8 18h3M13 18h3"
          >
          </path>

        </svg>

      </span>

      <span class="nav-label">
        Classes
      </span>

      <span class="nav-chevron" aria-hidden="true">
        {{ classesExpanded ? '⌄' : '›' }}
      </span>
    </button>

    <div
      class="submenu classes-submenu"
      [class.expanded]="classesExpanded"
    >
      <a
        routerLink="/classes"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="selectNavigation()"
      >
        Schedule
      </a>
      <a
        routerLink="/classes/bookings"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="selectNavigation()"
      >
        Bookings
      </a>
      <a
        routerLink="/classes/types"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="selectNavigation()"
      >
        Manage Class Types
      </a>
    </div>


    <!-- =====================================================
         ACCOUNTS
    ====================================================== -->

    <button
      class="nav-item nav-item-button"
      type="button"
      [class.active-parent]="accountsExpanded"
      title="Accounts"
      (click)="toggleAccounts()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="2"
          >
          </rect>

          <path
            d="M3 10h18"
          >
          </path>

          <path
            d="M7 15h3"
          >
          </path>

          <path
            d="M15 14h3"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Accounts
      </span>


      <span
        class="nav-chevron"
        aria-hidden="true"
      >

        {{
          accountsExpanded
            ? '⌄'
            : '›'
        }}

      </span>


    </button>


    <!-- =====================================================
         ACCOUNTS SUBMENU
    ====================================================== -->

    <div
      class="submenu accounts-submenu"
      [class.expanded]="accountsExpanded"
    >


      <!-- OVERVIEW -->

      <a
        routerLink="/accounts/overview"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="selectNavigation()"
      >

        Overview

      </a>


      <!-- INVOICES -->

      <a
        routerLink="/accounts/invoices"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="selectNavigation()"
      >

        Invoices

      </a>


      <!-- PAYMENTS -->

      <a
        routerLink="/accounts/payments"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="selectNavigation()"
      >

        Payments

      </a>


      <!-- EXPENSES -->

      <a
        routerLink="/accounts/expenses"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="selectNavigation()"
      >

        Expenses

      </a>


      <!-- REFUNDS -->

      <a
        routerLink="/accounts/refunds"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="selectNavigation()"
      >

        Refunds

      </a>


      <!-- PAYMENT METHODS -->

      <a
        routerLink="/accounts/payment-methods"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="selectNavigation()"
      >

        Payment Methods

      </a>


    </div>


    <!-- =====================================================
         PLANS
    ====================================================== -->

    <a
      class="nav-item"
      routerLink="/plans"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        exact: true
      }"
      title="Plans"
      (click)="selectNavigation()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Plans
      </span>


    </a>

    
<!-- EQUIPMENT -->

<a
  class="nav-item"
  routerLink="/equipment"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
  title="Equipment"
  (click)="selectNavigation()"
>

  <span class="nav-icon" aria-hidden="true">

    <svg viewBox="0 0 24 24">

      <path
        d="M6 8v8M9 6v12M15 6v12M18 8v8M3 10v4M21 10v4M3 12h18"
      />

    </svg>

  </span>

  <span class="nav-label">
    Equipment
  </span>

</a>



    <!-- =====================================================
         REPORTS
    ====================================================== -->

    <a
      class="nav-item"
      routerLink="/reports"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        exact: true
      }"
      title="Reports"
      (click)="selectNavigation()"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="M5 20V10M12 20V4M19 20v-7"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Reports
      </span>


    </a>


  </nav>


  <!-- =====================================================
       SIDEBAR FOOTER
  ====================================================== -->

  <div class="sidebar-footer">


    <!-- =====================================================
         DARK / LIGHT THEME
    ====================================================== -->

    <app-theme-toggle
      [compact]="collapsed"
    />


    <!-- =====================================================
         SIGN OUT
    ====================================================== -->

    <button
      class="nav-item nav-item-button"
      type="button"
      title="Sign Out"
    >


      <span
        class="nav-icon"
        aria-hidden="true"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"
          >
          </path>

        </svg>

      </span>


      <span class="nav-label">
        Sign Out
      </span>


    </button>


  </div>


</aside>
