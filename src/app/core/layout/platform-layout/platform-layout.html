<div
  class="platform-shell"
  [class.sidebar-collapsed]="sidebarCollapsed"
  [class.mobile-sidebar-open]="mobileSidebarOpen"
>


  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside
    class="platform-sidebar"
    [class.collapsed]="sidebarCollapsed"
    [class.mobile-open]="mobileSidebarOpen"
  >


    <!-- BRAND -->

    <div class="sidebar-brand">

      <span
        class="brand-mark"
        aria-hidden="true"
      >
        G
      </span>


      <div class="brand-copy">

        <strong>
          GymAdmin
        </strong>

        <span>
          PLATFORM ADMINISTRATION
        </span>

      </div>

    </div>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav
      class="sidebar-nav"
      aria-label="Platform navigation"
    >


      <!-- DASHBOARD -->

      <a
        class="nav-item"
        routerLink="/platform/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="Dashboard"
        (click)="closeMobileSidebar()"
      >

        <span
          class="nav-icon"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">

            <rect
              x="3"
              y="3"
              width="7"
              height="7"
              rx="1">
            </rect>

            <rect
              x="14"
              y="3"
              width="7"
              height="7"
              rx="1">
            </rect>

            <rect
              x="3"
              y="14"
              width="7"
              height="7"
              rx="1">
            </rect>

            <rect
              x="14"
              y="14"
              width="7"
              height="7"
              rx="1">
            </rect>

          </svg>

        </span>


        <span class="nav-label">
          Dashboard
        </span>

      </a>


      <!-- TENANTS -->

      <a
        class="nav-item"
        routerLink="/platform/tenants"
        routerLinkActive="active"
        title="Tenants"
        (click)="closeMobileSidebar()"
      >

        <span
          class="nav-icon"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">

            <path
              d="M4 21V5l8-3 8 3v16">
            </path>

            <path
              d="M8 9h2M8 13h2M8 17h2">
            </path>

            <path
              d="M14 9h2M14 13h2M14 17h2">
            </path>

            <path
              d="M2 21h20">
            </path>

          </svg>

        </span>


        <span class="nav-label">
          Tenants
        </span>

      </a>


      <!-- SUBSCRIPTION PLANS -->

      <a
        class="nav-item"
        routerLink="/platform/subscription-plans"
        routerLinkActive="active"
        title="Subscription Plans"
        (click)="closeMobileSidebar()"
      >

        <span
          class="nav-icon"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">

            <rect
              x="3"
              y="4"
              width="18"
              height="16"
              rx="2">
            </rect>

            <path
              d="M3 9h18">
            </path>

            <path
              d="M8 14h4">
            </path>

            <path
              d="M8 17h7">
            </path>

          </svg>

        </span>


        <span class="nav-label">
          Subscription Plans
        </span>

      </a>

    </nav>
    <!-- =====================================================
     ACCOUNTS
====================================================== -->

<div class="nav-group">


  <!-- ACCOUNTS PARENT -->
  <button
    type="button"
    class="nav-item nav-button nav-parent"
    [class.active]="isAccountsActive()"
    [class.expanded]="accountsOpen"
    title="Accounts"
    (click)="toggleAccounts()"
  >


    <!-- ICON -->
    <span
      class="nav-icon"
      aria-hidden="true"
    >

      <svg viewBox="0 0 24 24">

        <rect
          x="3"
          y="5"
          width="18"
          height="15"
          rx="2">
        </rect>

        <path
          d="M3 10h18">
        </path>

        <path
          d="M7 15h4">
        </path>

        <path
          d="M16 14v3">
        </path>

        <path
          d="M14.5 15.5h3">
        </path>

      </svg>

    </span>


    <!-- LABEL -->
    <span class="nav-label">

      Accounts

    </span>


    <!-- ARROW -->
    <span
      class="nav-chevron"
      aria-hidden="true"
    >

      ›

    </span>


  </button>


  <!-- =================================================
       ACCOUNTS SUB MENU
  ================================================== -->

  @if (accountsOpen) {

    <div class="nav-submenu">


      <!-- PAYMENTS -->
      <a
        class="sub-nav-item"
        routerLink="/platform/accounts/payments"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: false
        }"
        (click)="closeMobileSidebar()"
      >

        <span
          class="sub-nav-dot"
        >
        </span>

        <span>

          Payments

        </span>

      </a>


      <!-- INVOICES -->
      <a
        class="sub-nav-item"
        routerLink="/platform/accounts/invoices"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: false
        }"
        (click)="closeMobileSidebar()"
      >

        <span
          class="sub-nav-dot"
        >
        </span>

        <span>

          Invoices

        </span>

      </a>


    </div>

  }


</div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="sidebar-footer">


      <!-- SETTINGS -->

      <div class="sidebar-footer">


  <app-theme-toggle
    [compact]="sidebarCollapsed"
  />


  <button
    class="nav-item nav-button"
    type="button"
    title="Sign Out"
  >


    <span
      class="nav-icon"
      aria-hidden="true"
    >

      <svg viewBox="0 0 24 24">

        <path
          d="M10 5H5v14h5"
        >
        </path>

        <path
          d="M14 8l4 4-4 4"
        >
        </path>

        <path
          d="M8 12h10"
        >
        </path>

      </svg>

    </span>


    <span class="nav-label">
      Sign Out
    </span>


  </button>


</div>
      <!-- SIGN OUT -->

      <button
        class="nav-item nav-button"
        type="button"
        title="Sign Out"
      >

        <span
          class="nav-icon"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">

            <path
              d="M10 5H5v14h5">
            </path>

            <path
              d="M14 8l4 4-4 4">
            </path>

            <path
              d="M8 12h10">
            </path>

          </svg>

        </span>


        <span class="nav-label">
          Sign Out
        </span>

      </button>

    </div>

  </aside>


  <!-- MOBILE OVERLAY -->

  <button
    class="sidebar-overlay"
    type="button"
    aria-label="Close navigation"
    (click)="closeMobileSidebar()"
  >
  </button>


  <!-- =====================================================
       MAIN AREA
  ====================================================== -->

  <section class="platform-main">


    <!-- TOP HEADER -->

    <header class="platform-header">


      <button
        class="btn btn-icon menu-button"
        type="button"
        aria-label="Toggle sidebar"
        (click)="toggleSidebar()"
      >

        ☰

      </button>


      <div class="header-copy">

        <h1>
          Platform Administration
        </h1>

        <div class="breadcrumbs">

          GymAdmin

          <span>
            /
          </span>

          <span>
            Platform
          </span>

        </div>

      </div>


      <div class="admin-area">

        <span class="admin-avatar">
          PA
        </span>


        <div class="admin-copy">

          <strong>
            Platform Admin
          </strong>

          <span>
            System Administrator
          </span>

        </div>

      </div>

    </header>


    <!-- ROUTED CONTENT -->

    <main class="platform-content">

      <router-outlet />

    </main>

  </section>

</div>
